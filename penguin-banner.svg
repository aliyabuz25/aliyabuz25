<svg width="1200" height="240" viewBox="0 0 1200 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ali Yabuz banner with blue background, sliding penguins and snow">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="55%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <clipPath id="rounded">
      <rect width="1200" height="240" rx="18" ry="18" />
    </clipPath>

    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.1" />
    </filter>

    <g id="penguin">
      <ellipse cx="0" cy="0" rx="15" ry="23" />
      <circle cx="0" cy="-21" r="8" />
      <polygon points="8,-21 16,-18 8,-15" />
      <ellipse cx="-8" cy="-3" rx="4" ry="10" transform="rotate(-28 -8 -3)" />
      <ellipse cx="8" cy="-3" rx="4" ry="10" transform="rotate(28 8 -3)" />
      <ellipse cx="-5" cy="23" rx="3" ry="2" />
      <ellipse cx="5" cy="23" rx="3" ry="2" />
    </g>
  </defs>

  <g clip-path="url(#rounded)">
    <rect width="1200" height="240" fill="url(#bg)" />

    <g opacity="0.14" fill="#93c5fd">
      <path d="M0 166 C120 144, 248 192, 360 172 C520 142, 662 198, 806 173 C942 152, 1060 192, 1200 170 L1200 240 L0 240 Z" />
    </g>

    <g opacity="0.28" fill="#020617" filter="url(#softBlur)">
      <g transform="translate(-120 188)">
        <use href="#penguin" />
        <animateTransform attributeName="transform" type="translate" values="-120 188;1240 184;-120 188" dur="24s" repeatCount="indefinite" />
      </g>
      <g transform="translate(-320 198) scale(0.85)">
        <use href="#penguin" />
        <animateTransform attributeName="transform" type="translate" values="-320 198;1210 194;-320 198" dur="18s" repeatCount="indefinite" />
      </g>
      <g transform="translate(1320 192) scale(0.95)">
        <use href="#penguin" />
        <animateTransform attributeName="transform" type="translate" values="1320 192;-140 188;1320 192" dur="22s" repeatCount="indefinite" />
      </g>
      <g transform="translate(1260 184) scale(0.72)">
        <use href="#penguin" />
        <animateTransform attributeName="transform" type="translate" values="1260 184;-100 182;1260 184" dur="16s" repeatCount="indefinite" />
      </g>
    </g>

    <g fill="#ffffff" opacity="0.9">
      <circle cx="70" cy="-12" r="2.1"><animate attributeName="cy" values="-12;260" dur="6.8s" begin="0.2s" repeatCount="indefinite" /><animate attributeName="cx" values="70;82;70" dur="3.1s" repeatCount="indefinite" /></circle>
      <circle cx="160" cy="-30" r="1.8"><animate attributeName="cy" values="-30;260" dur="7.8s" begin="1.1s" repeatCount="indefinite" /><animate attributeName="cx" values="160;149;160" dur="2.6s" repeatCount="indefinite" /></circle>
      <circle cx="260" cy="-14" r="2.5"><animate attributeName="cy" values="-14;260" dur="6.4s" begin="0.7s" repeatCount="indefinite" /><animate attributeName="cx" values="260;272;260" dur="3.3s" repeatCount="indefinite" /></circle>
      <circle cx="350" cy="-20" r="2"><animate attributeName="cy" values="-20;260" dur="8.6s" begin="0.1s" repeatCount="indefinite" /><animate attributeName="cx" values="350;362;350" dur="2.9s" repeatCount="indefinite" /></circle>
      <circle cx="460" cy="-6" r="2.3"><animate attributeName="cy" values="-6;260" dur="7.1s" begin="1.4s" repeatCount="indefinite" /><animate attributeName="cx" values="460;449;460" dur="3.0s" repeatCount="indefinite" /></circle>
      <circle cx="560" cy="-26" r="1.9"><animate attributeName="cy" values="-26;260" dur="8.2s" begin="0.4s" repeatCount="indefinite" /><animate attributeName="cx" values="560;574;560" dur="3.5s" repeatCount="indefinite" /></circle>
      <circle cx="660" cy="-10" r="2.6"><animate attributeName="cy" values="-10;260" dur="6.7s" begin="0.9s" repeatCount="indefinite" /><animate attributeName="cx" values="660;647;660" dur="2.7s" repeatCount="indefinite" /></circle>
      <circle cx="760" cy="-18" r="2.1"><animate attributeName="cy" values="-18;260" dur="7.9s" begin="1.2s" repeatCount="indefinite" /><animate attributeName="cx" values="760;773;760" dur="3.2s" repeatCount="indefinite" /></circle>
      <circle cx="860" cy="-8" r="2.7"><animate attributeName="cy" values="-8;260" dur="6.5s" begin="0.5s" repeatCount="indefinite" /><animate attributeName="cx" values="860;847;860" dur="2.5s" repeatCount="indefinite" /></circle>
      <circle cx="960" cy="-24" r="2"><animate attributeName="cy" values="-24;260" dur="8.8s" begin="0s" repeatCount="indefinite" /><animate attributeName="cx" values="960;976;960" dur="3.7s" repeatCount="indefinite" /></circle>
      <circle cx="1060" cy="-12" r="2.2"><animate attributeName="cy" values="-12;260" dur="7.3s" begin="1.7s" repeatCount="indefinite" /><animate attributeName="cx" values="1060;1048;1060" dur="2.8s" repeatCount="indefinite" /></circle>
      <circle cx="1140" cy="-28" r="1.8"><animate attributeName="cy" values="-28;260" dur="8.4s" begin="0.8s" repeatCount="indefinite" /><animate attributeName="cx" values="1140;1152;1140" dur="3.1s" repeatCount="indefinite" /></circle>
    </g>
  </g>

  <text x="600" y="130" text-anchor="middle" fill="#ffffff" font-size="56" font-family="Segoe UI, Arial, sans-serif" font-weight="700">
    Ali Yabuz
  </text>
</svg>
