<svg width="1200" height="240" viewBox="0 0 1200 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ali Yabuz banner with moving penguin shadows">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.6" />
    </filter>
  </defs>

  <rect width="1200" height="240" fill="url(#bg)" rx="18" />

  <g opacity="0.22" fill="#020617" filter="url(#blur)">
    <ellipse cx="180" cy="185" rx="24" ry="10">
      <animate attributeName="cx" values="180;1080;180" dur="24s" repeatCount="indefinite" />
    </ellipse>
    <ellipse cx="60" cy="190" rx="18" ry="8">
      <animate attributeName="cx" values="60;990;60" dur="18s" repeatCount="indefinite" />
    </ellipse>
    <ellipse cx="360" cy="188" rx="21" ry="9">
      <animate attributeName="cx" values="360;1130;360" dur="20s" repeatCount="indefinite" />
    </ellipse>
    <ellipse cx="620" cy="186" rx="26" ry="10">
      <animate attributeName="cx" values="620;80;620" dur="22s" repeatCount="indefinite" />
    </ellipse>
  </g>

  <g opacity="0.16" fill="#020617">
    <path d="M0 195 C120 170, 240 210, 360 192 C500 170, 620 215, 760 192 C910 168, 1030 210, 1200 188 L1200 240 L0 240 Z" />
  </g>

  <text x="600" y="122" text-anchor="middle" fill="#ffffff" font-size="56" font-family="Segoe UI, Arial, sans-serif" font-weight="700">
    Ali Yabuz
  </text>
</svg>
